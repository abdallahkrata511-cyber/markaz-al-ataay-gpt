name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Accounting tests
        run: npm run test:accounting

      - name: Build web application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Java and Gradle
        run: |
          java -version
          javac -version
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p app-build

          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          fi

          echo "Found APK: $APK_FILE"

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_FILE" app-build/alataya-distribution-v1.apk
          ls -lh app-build/alataya-distribution-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alataya-distribution-apk
          path: app-build/alataya-distribution-v1.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "تطبيق مركز العطايا للأندرويد"
          draft: false
          prerelease: false
          files: app-build/alataya-distribution-v1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
